<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIXX BY YAS - Loan Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><header class="hero">
    <h1>MIXX BY YAS</h1>
    <p>Fast and Simple Loan Application</p>
</header><section class="form-container">
    <form id="loanForm">    <h2>Apply for a Loan</h2>

    <input type="text" id="fullname" placeholder="Full Name" required>

    <input type="tel" id="phone" placeholder="Phone Number" required>

    <input type="number" id="amount" placeholder="Loan Amount" required>

    <select id="period" required>
        <option value="">Repayment Period</option>
        <option>7 Days</option>
        <option>14 Days</option>
        <option>30 Days</option>
        <option>60 Days</option>
    </select>

    <input type="text" id="country" placeholder="Country" required>

    <button type="submit">Submit Application</button>

    <p id="status"></p>

</form>

</section><footer>
    <p>© 2026 MIXX BY YAS</p>
</footer><script src="script.js"></script></body>
  </html>
